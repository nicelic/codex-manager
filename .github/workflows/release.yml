name: "Release Build and Publish"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v1.0.33)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: "Build and Publish Release"
    runs-on: windows-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Resolve Version (Scheme A - Tag as Single Source of Truth)"
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag_name }}"
          if (-not $tag) {
            $tag = "${{ github.ref_name }}"
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+') {
            Write-Error "Invalid tag format: '$tag'. Expected format: 'vX.Y.Z'"
            exit 1
          }

          $rawVersion = $tag -replace '^v', ''
          Write-Host "Target Tag    : $tag"
          Write-Host "Raw Version   : $rawVersion"

          Write-Host "Syncing version in backend/Cargo.toml..."
          $cargoPath = "backend/Cargo.toml"
          $cargoContent = Get-Content -Path $cargoPath -Raw -Encoding UTF8
          $newCargo = $cargoContent -replace '(?m)^version\s*=\s*"[^"]+"', "version = `"$rawVersion`""
          Set-Content -Path $cargoPath -Value $newCargo -Encoding UTF8

          Write-Host "Syncing version in frontend/package.json..."
          $pkgPath = "frontend/package.json"
          $pkgContent = Get-Content -Path $pkgPath -Raw -Encoding UTF8
          $newPkg = $pkgContent -replace '"version":\s*"[^"]+"', "`"version`": `"$rawVersion`""
          Set-Content -Path $pkgPath -Value $newPkg -Encoding UTF8

          Write-Host "Syncing version in vision.md..."
          $visionPath = "vision.md"
          if (Test-Path $visionPath) {
            $visionContent = Get-Content -Path $visionPath -Raw -Encoding UTF8
            $newVision = $visionContent -replace '(?m)^vision:\s*.*$', "vision: $tag"
            Set-Content -Path $visionPath -Value $newVision -Encoding UTF8
          }

          Select-String -Path $cargoPath -Pattern '^version\s*=' | ForEach-Object { Write-Host "Cargo.toml -> $_" }
          Select-String -Path $pkgPath -Pattern '"version":' | ForEach-Object { Write-Host "package.json -> $_" }

          "TAG_NAME=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding UTF8
          "RAW_VERSION=$rawVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding UTF8

      - name: "Setup Node.js (Latest)"
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'

      - name: "Setup Rust (Latest Stable)"
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: "Build Frontend (Vue Latest)"
        shell: pwsh
        run: |
          cd frontend
          Write-Host "Installing frontend dependencies..."
          npm ci || npm install
          Write-Host "Building frontend assets with Vite..."
          npm run build
          if (-not (Test-Path "dist/index.html")) {
            Write-Error "frontend/dist/index.html not generated!"
            exit 1
          }
          Write-Host "Frontend build completed successfully."

      - name: "Build Rust Backend (code-Manager-rust.exe)"
        shell: pwsh
        run: |
          cd backend
          Write-Host "Compiling Rust release binary..."
          cargo build --release
          $exePath = "target/release/code-Manager-rust.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "Backend executable $exePath not found!"
            exit 1
          }
          Write-Host "Backend build completed successfully."

      - name: "Prepare Artifacts and Calculate Hashes"
        id: artifacts
        shell: pwsh
        run: |
          $distDir = "dist-assets"
          if (-not (Test-Path $distDir)) {
            New-Item -ItemType Directory -Path $distDir | Out-Null
          }

          $srcExe = "backend/target/release/code-Manager-rust.exe"
          $destExe = Join-Path $distDir "code-Manager-rust.exe"
          Copy-Item -Path $srcExe -Destination $destExe -Force
          $exeHash = (Get-FileHash -Path $destExe -Algorithm SHA256).Hash.ToLower()
          Write-Host "Asset 1: code-Manager-rust.exe -> $exeHash"

          $bundleName = "codex-manager-backup-${env:TAG_NAME}.bundle"
          $destBundle = Join-Path $distDir $bundleName
          Write-Host "Creating Git Bundle ($bundleName)..."
          git bundle create $destBundle --all
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $destBundle)) {
            Write-Error "git bundle creation failed!"
            exit 1
          }
          $bundleHash = (Get-FileHash -Path $destBundle -Algorithm SHA256).Hash.ToLower()
          Write-Host "Asset 2: $bundleName -> $bundleHash"

          $lines = @(
              "$($env:TAG_NAME) release. Windows executable included."
              "SHA-256: $exeHash"
              "code-Manager-rust.exe"
              ""
              "SHA-256: $bundleHash"
              "$bundleName (Complete offline Git bundle)"
          )
          $releaseBody = $lines -join "`n"

          if (Test-Path "RELEASE_NOTES.md") {
              $notes = (Get-Content -Path "RELEASE_NOTES.md" -Raw -Encoding UTF8).Trim()
              if ($notes) {
                  $releaseBody += "`n`n更新说明:`n" + $notes
              }
          }

          Set-Content -Path "dist-assets/release_body.md" -Value $releaseBody -Encoding UTF8

      - name: "Publish to GitHub Releases"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          body_path: dist-assets/release_body.md
          files: |
            dist-assets/code-Manager-rust.exe
            dist-assets/codex-manager-backup-${{ env.TAG_NAME }}.bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
