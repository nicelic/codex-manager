[package]
name = "edit-rust"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "code-Manager-rust"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2.0"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
open = "5.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
url = "2.5"
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
winreg = "0.56"
zip = { version = "8", default-features = false, features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi"] }

[dev-dependencies]
toml = "0.8"

[profile.dev]
debug = 1
incremental = false

[profile.dev.package."*"]
debug = 0
